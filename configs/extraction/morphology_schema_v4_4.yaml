  # CPL-specific scan-quality markers (cpl_review_of_scans only)
  - name: out_of_focus
    organs: [liver, right_lung, left_lung, cns_post, cns_trans]
    description: >-
      Scan is out of focus / blurry / unfocused, so interpretation is
      unreliable. Specific to `cpl_review_of_scans` (the reader is
      reviewing a digital scan, not a physical slide).
    synonyms:
      - "out of focus"
      - "blurry slide"
      - blurry
      - "moderately blurry"
      - "unfocused slide"
      - unfocused
    severity_values: []
    extent_values: []
    modifiers: {}

  - name: no_scans_available
    organs: [liver, right_lung, left_lung, cns_post, cns_trans]
    description: >-
      No scan slides available to be reviewed for this organ. Specific
      to `cpl_review_of_scans`.
    synonyms:
      - "no scan slides available"
      - "no slides available to be reviewed"
      - "scan not available"
    severity_values: []
    extent_values: []
    modifiers: {}

  - name: no_meninges_present
    organs: [cns_post, cns_trans]
    description: >-
      Meninges absent in the sample, so meningitis cannot be assessed.
      Common CNS-specific quality marker. If this fires, do NOT also
      emit a `meningitis` finding from the same clause.
    synonyms:
      - "no meninges present"
      - "meninges absent"
      - "meninges not present"
      - "meninges not sampled"
      - "no meningeal tissue"
      - "no meninges"
    severity_values: []
    extent_values: []
    modifiers: {}

  - name: meninges_present
    organs: [cns_post, cns_trans]
    description: >-
      Meninges ARE present in the sample; the positive complement of
      `no_meninges_present`. Distinguishes "meningitis-eligible
      examined" (clean negative) from "meningitis-eligible never seen"
      (uninterpretable). Almost always the literal phrase "Meninges
      present" appearing as the first line of the CNS section, before
      any morphology call. Also emit on implicit-positive phrasings
      ("Technically adequate with unremarkable meninges").
    synonyms:
      - "meninges present"
      - "meninges seen"
      - "meningeal tissue present"
      - "unremarkable meninges"
    severity_values: []
    extent_values: []
    modifiers: {}

  - name: nasal_contents_present
    organs: [cns_trans]
    description: >-
      Nasal contents present in a CNS-transnasal sample; a sampling
      contamination flag. Distinguishes nasal-cavity inflammation /
      bacteria / yeasts from intraparenchymal CNS infection. Emit on
      the literal phrase "Nasal contents present" / "Nasal content
      present" AND on descriptive phrases like "nasal content composed
      by squames, fibrin and bacteria" / "nasal content with abundant
      fibrin, neutrophils, squames, nasal epithelial cells".
    synonyms:
      - "nasal contents present"
      - "nasal content present"
      - "nasal content with"
      - "nasal content composed"
