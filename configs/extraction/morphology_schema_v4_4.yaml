# Morphology extraction schema.
#
# This schema defines the morphological findings a language model extracts
# from CHAMPS pathology reports, the synonyms that route prose to each
# finding, and the modifiers that capture how each finding is qualified.
#
# Standing extraction principles:
#
# * Faithful literal extraction. Record what the pathologist actually
#   wrote. Do not infer composition, syndrome substrates, or clinical
#   class from organ context. Clinical inference is deferred to a
#   downstream resolver that consumes TAC, IHC, and lab results plus
#   optional priors, where the assignment is auditable and can be
#   NaN-masked.
#
# * Severity is a 5-bin ladder. Each finding's `severity_values` is
#   `[minimal, mild, moderate, severe, extensive]` (or empty when the
#   corpus never grades the finding). Amount words map onto the ladder:
#     minimal / rare / few / occasional / scant / sparse / infrequent / minor -> minimal
#     mild / slight -> mild
#     moderate -> moderate
#     severe / marked / abundant / numerous / many / heavy -> severe
#     extensive / massive / widespread -> extensive
#   The outer rungs collapse onto their neighbours (minimal -> mild,
#   extensive -> severe) for any analysis that needs the 3-bin ladder.
#
# * Some findings are split per organ because their enums differ by
#   organ: necrosis, congestion, hemorrhage, and hemosiderin each have
#   liver / lung / CNS variants. Other findings (hemozoin_pigment,
#   viral_inclusions, bacterial_colonies, fungal,
#   intraerythrocytic_parasites, edema, fibrin, thrombosis, granulomas,
#   calcification, EMH, atypical cells) are cross-organ.
#
# * Pigment is recorded by what is named. Emit `hemozoin_pigment` only
#   when the report states hemozoin / malarial pigment or describes the
#   pigment as polarizable or birefringent. Emit `*_hemosiderin` only
#   when iron is named (hemosiderin, hemosiderosis, iron stain,
#   iron-laden, siderophage, Perls, Prussian blue). Pigment described by
#   colour or location alone routes to `pigment_unspecified`.
#
# * DAD and `diffuse_alveolar_damage` are literal labels. Record the
#   term as the pathologist wrote it; when inner morphology is also
#   named, emit both the literal label and the named substrates.
#
# * Modifiers capture severity, extent, character, and location for each
#   finding.

schema_version: "v4.4"

organs:
  - right_lung
  - left_lung
  - liver
  - cns_post
  - cns_trans

# All sources. site_report is extracted as an independent source; consumers
# filter it downstream when a CPL-only view is needed.
# `implicit_cpl` covers headerless reports that lexically score as CPL
# physical-slide content (HEADERLESS origin per `attribute_origin`); these
# read as CPL_SLIDES vocabulary, so they are routed as a CPL_SLIDES
# surrogate.
text_sources:
  - site_report
  - cpl_review_of_scans
  - cpl_slides
  - implicit_cpl

# ---------------------------------------------------------------------------
# Conditions: positive morphological findings
# ---------------------------------------------------------------------------

conditions:

  # ===========================================================================
  # INFLAMMATION (named by anatomic compartment; character via modifier)
  # ===========================================================================

  - name: bronchopneumonia
    organs: [right_lung, left_lung]
    description: >-
      Neutrophilic infiltrate filling alveolar spaces. Typically
      neutrophilic / suppurative, with mixed / mononuclear /
      eosinophilic variants also seen; put the character in
      `modifiers.inflammation_character`. DO NOT also emit a separate
      `pneumonitis` finding for the same clause unless interstitial
      inflammation is independently described. In LUNG context
      "suppurative inflammation" / "suppurative pneumonia" / "purulent
      pneumonia" are synonyms for bronchopneumonia. (In other organs,
      "suppurative" is a character qualifier, not bronchopneumonia.)
      Necrotizing BPN → emit BOTH `bronchopneumonia` AND `lung_necrosis`.
      "Aspiration pneumonia" only routes here when aspirated material is
      named in the same clause OR the phrase appears in a lung morphology
      block (not a clinical preamble). An aspiration clause that names
      suppurative / neutrophilic / acute inflammation co-fires
      bronchopneumonia alongside the aspiration finding; a bare "with
      inflammation" sets the aspiration modifier only.
    synonyms:
      - bronchopneumonia
      - "broncho-pneumonia"
      - "neutrophilic alveolar infiltrate"
      - "intraalveolar neutrophils"
      - "intraalveolar neutrophilic inflammation"
      - "intra-alveolar neutrophils with fibrin"
      - "swaths of neutrophils"
      - "mixed inflammatory infiltrate in alveolar spaces"
      - "suppurative pneumonia"
      - "suppurative inflammation"
      - "purulent pneumonia"
      - "acute bacterial pneumonia"
      - "neutrophilic pneumonia"
      - "necrotizing bronchopneumonia"
      - "necrotizing pneumonia"
    severity_values: [minimal, mild, moderate, severe, extensive]
    extent_values: [focal, multifocal, patchy, diffuse, scattered]
    modifiers:
      inflammation_character: [neutrophilic, mononuclear_lymphocytic, mixed, eosinophilic]

  - name: pneumonitis
    organs: [right_lung, left_lung]
    description: >-
      Interstitial inflammation widening alveolar septa. Use this for
      ANY interstitial inflammation regardless of cellular character;
      put the character in `modifiers.inflammation_character`. Includes
      "interstitial pneumonitis", "interstitial inflammation",
      "interstitial mononuclear / lymphocytic / mixed infiltrate", and
      subclinical phrasings ("increased interstitial inflammatory
      infiltrate", "increased interstitial mononuclear cells",
      "increased interstitial lymphocytes", "rare interstitial
      eosinophils", "scattered interstitial inflammation"). Distinct
      from bronchopneumonia (which is intra-alveolar). Mononuclear
      character includes `lymphohistiocytic`, `lymphoplasmacytic`,
      `lymphocytic`, `plasmacytic`, `histiocytic` phrasings;
      collapse all to `mononuclear_lymphocytic`. RDS lungs with
      pneumonitis are legitimate co-fires with `hyaline_membranes`;
      both should fire.
    synonyms:
      - "interstitial pneumonitis"
      - "interstitial inflammation"
      - "interstitial infiltrate"
      - "interstitial mononuclear infiltrate"
      - "interstitial lymphocytic infiltrate"
      - "interstitial mixed inflammation"
      - "septal thickening with inflammation"
      - "widening of alveolar septa"
      - "alveolar septal expansion"
      - "mononuclear cells"
      - "mononuclear infiltrate"
      - "lymphoplasmacytic"
      - "lymphohistiocytic"
      - "lymphocytic pneumonitis"
      - "mononuclear interstitial pneumonitis"
      - "mixed interstitial pneumonitis"
      - "increased interstitial inflammatory infiltrate"
      - "increased interstitial mononuclear cells"
      - "increased interstitial lymphocytes"
    severity_values: [minimal, mild, moderate, severe, extensive]
    extent_values: [focal, multifocal, patchy, diffuse, scattered]
    modifiers:
      inflammation_character: [neutrophilic, mononuclear_lymphocytic, mixed, eosinophilic]

  - name: bronchiolitis
    organs: [right_lung, left_lung]
    description: >-
      Inflammation centered on bronchioles (airway-wall finding). Route
      large-airway phrasings ("lymphohistiocytic bronchitis") elsewhere;
      bronchitis is NOT bronchiolitis.
    synonyms:
      - bronchiolitis
      - "acute bronchiolitis"
      - "necrotizing bronchiolitis"
      - "chronic bronchiolitis"
      - "peribronchiolar lymphocytic infiltrate"
      - "peribronchial"
      - intrabronchiolar
      - "bronchiolar wall infiltrate"
      - "submucosal mononuclear inflammation"
    severity_values: [minimal, mild, moderate, severe, extensive]
    extent_values: [focal, multifocal]
    modifiers:
      inflammation_character: [neutrophilic, mononuclear_lymphocytic, mixed, eosinophilic]

  - name: pleuritis
    organs: [right_lung, left_lung]
    description: >-
      Pleural surface inflammation (often fibrinous). Route
      `fibrinous pleuritis` / `fibrin in pleural surface` here with
      `inflammation_character` if applicable; do NOT emit a separate
      `fibrin` finding for pleural fibrin.
    synonyms: [pleuritis, "pleural inflammation", "fibrinous pleuritis", "fibrin in pleural surface"]
    severity_values: [minimal, mild, moderate, severe, extensive]
    extent_values: [focal, multifocal]
    modifiers:
      inflammation_character: [neutrophilic, mononuclear_lymphocytic, mixed]

  - name: organizing_pneumonia
    organs: [right_lung, left_lung]
    description: "Intraluminal connective tissue plugs in distal airspaces (BOOP / Masson bodies)."
    synonyms: ["organizing pneumonia", BOOP, "Masson bodies", "intraluminal organization"]
    severity_values: []
    extent_values: [focal, multifocal, patchy]
    modifiers: {}

  - name: meningitis
    organs: [cns_post, cns_trans]
    description: >-
      Meningeal inflammation. Use `modifiers.inflammation_character`
      for neutrophilic / lymphocytic / mixed character. Mononuclear
      character includes `lymphohistiocytic` phrasings.
      NOTE: requires meninges to be present in the sample; if "no
      meninges present" is noted, emit the `no_meninges_present`
      quality flag and do NOT emit a meningitis finding.
      "Meningoencephalitis" → emit BOTH `meningitis` AND `encephalitis`
      (emit one finding per side per condition).
      "Granulomatous meningitis" → use `granulomas` finding instead.
      "Choroiditis" / "choroid plexus inflammation" → emit as
      `meningitis` with character.
      Meningitis + intracellular/intravascular bacteria in the same
      clause → co-emit `bacterial_colonies`.
    synonyms:
      - meningitis
      - "neutrophilic meningitis"
      - "lymphocytic meningitis"
      - "purulent meningitis"
      - "mixed meningitis"
      - "suppurative meningitis"
      - "suppurative inflammation"
      - "mononuclear infiltrate in the meninges"
      - "lymphohistiocytic meningitis"
      - choroiditis
      - "choroid plexus inflammation"
    severity_values: [minimal, mild, moderate, severe, extensive]
    extent_values: [focal, multifocal]
    modifiers:
      inflammation_character: [neutrophilic, mononuclear_lymphocytic, mixed]

  - name: encephalitis
    organs: [cns_post, cns_trans]
    description: >-
      Brain parenchyma inflammation. Includes cerebritis,
      meningoencephalitis, ventriculitis as the same morphological
      category. For "meningoencephalitis" co-emit `meningitis` AS
      WELL as encephalitis. Use `modifiers.inflammation_character`
      for cellular composition; `lymphohistiocytic` and
      `lymphoplasmacytic` collapse to `mononuclear_lymphocytic`.
      Use `modifiers.leukocytosis_compartment` to disambiguate pure
      intravascular leukocytosis (sepsis pattern that resembles
      encephalitis but is actually intravascular) from parenchymal
      encephalitis. If the report says only "intravascular leukocytosis"
      WITHOUT parenchymal cell infiltrate, do NOT emit encephalitis;
      emit `lung_intravascular_leukocytosis` (lung) or set the modifier
      `leukocytosis_compartment=intravascular` with character only
      (CNS).
      Microglial nodules + parenchymal inflammation → emit BOTH this
      finding AND `gliosis` (with `gliosis_pattern: microglial_nodule`).
    synonyms:
      - encephalitis
      - meningoencephalitis
      - cerebritis
      - ventriculitis
      - "parenchymal inflammation"
      - "lymphohistiocytic encephalitis"
      - "lymphohistiocytic meningoencephalitis"
      - "pyogranulomatous inflammation"
      - "inflammation of uncertain etiology"
    severity_values: [minimal, mild, moderate, severe, extensive]
    extent_values: [focal, multifocal, patchy, scattered]
    modifiers:
      inflammation_character: [neutrophilic, mononuclear_lymphocytic, mixed]
      leukocytosis_compartment: [intravascular, parenchymal, both]

  - name: perivascular_inflammation
    organs: [cns_post, cns_trans]
    description: "Perivascular inflammatory cuffing in brain."
    synonyms: ["perivascular inflammation", "perivascular cuffing", "perivascular lymphocytes"]
    severity_values: [minimal, mild, moderate, severe, extensive]
    extent_values: [focal, multifocal]
    modifiers:
      inflammation_character: [mononuclear_lymphocytic, mixed, eosinophilic]

  - name: hepatic_inflammation_portal
    organs: [liver]
    description: >-
      Portal-tract inflammation (includes "cholangitis", "biliary
      inflammation", "ductulitis", "portal triaditis", "portal-based
      inflammation"). Use `modifiers.inflammation_character` for
      composition. Mononuclear character includes `lymphohistiocytic`,
      `lymphoplasmacytic`, `histiocytic`, `plasmacytic` phrasings;
      collapse to `mononuclear_lymphocytic`.
      "Interface hepatitis" routes to `hepatic_inflammation_lobular`,
      not here.
      The `chronic` adjective is not a separate axis: discard
      `acuity=chronic`.
    synonyms:
      - "portal inflammation"
      - "portal infiltrate"
      - "periportal inflammation"
      - "portal mononuclear infiltrate"
      - "portal lymphocytic infiltrate"
      - "portal mixed infiltrate"
      - "portal neutrophilic infiltrate"
      - "portal hepatitis"
      - "portal triaditis"
      - "portal-based inflammation"
      - cholangitis
      - "biliary inflammation"
      - ductulitis
    severity_values: [minimal, mild, moderate, severe, extensive]
    extent_values: [focal, multifocal, scattered, patchy, diffuse]
    modifiers:
      inflammation_character: [neutrophilic, mononuclear_lymphocytic, mixed, eosinophilic]

  - name: hepatic_inflammation_lobular
    organs: [liver]
    description: >-
      Intra-lobular inflammation. Use `modifiers.inflammation_character`.
      Includes interface hepatitis. "Active hepatitis" / "chronic
      hepatitis" without further qualifier route here.
      Note: `lobular disarray` is an architectural descriptor (not
      inflammation); do NOT trigger on it.
    synonyms:
      - "lobular inflammation"
      - "lobular infiltrate"
      - "lobular hepatitis"
      - "interface hepatitis"
      - "diffuse mixed hepatitis"
      - "active hepatitis"
      - "chronic hepatitis"
    severity_values: [minimal, mild, moderate, severe, extensive]
    extent_values: [focal, multifocal, scattered, patchy, diffuse]
    modifiers:
      inflammation_character: [neutrophilic, mononuclear_lymphocytic, mixed]

  - name: hepatic_inflammation_sinusoidal
    organs: [liver]
    description: >-
      Inflammatory cells within hepatic sinusoids; a sepsis-pattern
      signal. Same morphology whether the report says "sinusoidal
      inflammation", "sinusoidal leukocytosis", "sinusoidal
      lymphocytes/neutrophils", or "intravascular leukocytosis" in a
      liver block: emit a SINGLE `hepatic_inflammation_sinusoidal`
      finding (do NOT emit two findings for "sinusoidal and
      intravascular leukocytosis").
      Mononuclear character includes `lymphocyte`, `plasma cell`,
      `lymphoid` phrasings.
    synonyms:
      - "sinusoidal leukocytosis"
      - "sinusoidal inflammation"
      - "sinusoidal infiltrate"
      - "intravascular leukocytosis"
      - "sinusoidal lymphocytes"
      - "sinusoidal neutrophils"
    severity_values: [minimal, mild, moderate, severe, extensive]
    extent_values: [focal, multifocal, scattered, patchy]
    modifiers:
      inflammation_character: [neutrophilic, mononuclear_lymphocytic, mixed, eosinophilic]

  - name: lung_intravascular_leukocytosis
    organs: [right_lung, left_lung]
    description: >-
      Inflammatory cells (typically neutrophils) within lung vasculature
      WITHOUT alveolar / interstitial infiltrate. Sepsis-pattern signal.
      Distinct from `bronchopneumonia` (intra-alveolar) and `pneumonitis`
      (interstitial). Often co-fires with `congestion` and / or
      `bacterial_colonies` (sepsis-pattern triad).
      Do NOT emit on hepatic blocks (use `hepatic_inflammation_sinusoidal`).
    synonyms:
      - "intravascular leukocytosis"
      - "leukocytosis"
      - "intravascular neutrophils"
      - "vascular leukocytosis"
    severity_values: [minimal, mild, moderate, severe, extensive]
    extent_values: [focal, multifocal]
    modifiers:
      inflammation_character: [neutrophilic, mononuclear_lymphocytic, mixed]

  # ===========================================================================
  # ALVEOLAR INJURY
  # ===========================================================================

  - name: diffuse_alveolar_damage
    organs: [right_lung, left_lung]
    description: >-
      Literal extraction of the term "diffuse alveolar damage" / "DAD"
      when the pathologist uses it. Emit the label alone for a bare
      term: the pathologist named the syndrome, not the substrate, so
      do not expand it to `hyaline_membranes` / `pneumocyte_hyperplasia`
      at extraction time. When inner morphology IS also stated alongside
      DAD (e.g. "DAD with hyaline membranes, moderate"), emit BOTH this
      label AND the literally-named substrate finding(s). Downstream
      resolution may expand DAD to its CHAMPS-definitional substrates
      (Martines 2019: HM + type II pneumocyte hyperplasia) at
      manifest-build time if the training target requires it.
    synonyms:
      - "diffuse alveolar damage"
      - "DAD"
    severity_values: [minimal, mild, moderate, severe, extensive]
    extent_values: [focal, multifocal, patchy, diffuse]
    modifiers: {}

  - name: hyaline_membranes
    organs: [right_lung, left_lung]
    description: >-
      Eosinophilic proteinaceous membranes lining alveoli; characteristic
      of DAD/RDS. The clinical syndrome names HMD / RDS / IRDS fold here
      (they literally denote hyaline-membrane disease, a lexical synonym
      rather than an inference). When the report writes the bare term
      "DAD" / "diffuse alveolar damage" with no substrate named, emit
      `diffuse_alveolar_damage` instead; do not expand it here.
      Note: HM maps `rare` to `mild` (not minimal); HM is a discrete
      morphology.
    synonyms:
      - "hyaline membranes"
      - "hyaline membrane"
      - "hyaline membrane formation"
      - "hyaline membrane deposits"
      - "hyaline membrane disease"
      - "HMD"
      - "IRDS"
      - "RDS"
      - "infant respiratory distress syndrome"
      - "neonatal respiratory distress syndrome"
      - "findings compatible with IRDS"
      - "findings compatible with HMD"
    severity_values: [minimal, mild, moderate, severe, extensive]
    extent_values: [focal, multifocal, patchy, diffuse, scattered]
    modifiers: {}

  - name: pneumocyte_hyperplasia
    organs: [right_lung, left_lung]
    description: >-
      Type II pneumocyte hyperplasia / proliferation; reactive.
      Hyperplastic multinucleated cells route to `viral_inclusions`
      (syncytia), NOT here, unless explicitly stated as type II.
    synonyms:
      - "type II pneumocyte hyperplasia"
      - "type 2 pneumocyte hyperplasia"
      - "pneumocyte hyperplasia"
      - "pneumocyte proliferation"
      - "type II pneumocytes"
      - "type II hyperplasia"
    severity_values: [minimal, mild, moderate, severe, extensive]
    extent_values: [focal, multifocal, diffuse, scattered]
    modifiers: {}

  - name: atelectasis
    organs: [right_lung, left_lung]
    description: "Collapsed / non-aerated alveolar tissue."
    synonyms:
      - atelectasis
      - atelectatic
      - "collapsed alveoli"
      - "collapsed lung"
      - "collapsed airways"
      - "collapsed airspaces"
      - "airway collapse"
      - "compression atelectasis"
      - compressed
      - "partially collapsed"
    severity_values: []
    extent_values: [focal, multifocal, diffuse]
    modifiers: {}

  - name: overinflation
    organs: [right_lung, left_lung]
    description: "Hyperinflated / overdistended alveoli."
    synonyms: [overinflation, hyperinflation, "alveolar overdistension"]
    severity_values: []
    extent_values: []
    modifiers: {}

  - name: increased_alveolar_macrophages
    organs: [right_lung, left_lung]
    description: >-
      Increased intraalveolar macrophages; a reactive non-inflammatory
      finding. `hemosiderin-laden macrophages` → `lung_hemosiderin`.
      `pigmented macrophages` / `macrophages with hemozoin pigment` →
      `hemozoin_pigment`. `macrophages with anthracotic pigment` →
      this label only (anthracotic pigment is not separately recorded).
      `macrophages with engulfed squames/meconium` → this label AND
      `aspiration_*`.
    synonyms:
      - "increased alveolar macrophages"
      - "increased intraalveolar macrophages"
      - "increased intra-alveolar macrophages"
      - "prominent alveolar macrophages"
      - "abundant alveolar macrophages"
    severity_values: [minimal, mild, moderate, severe, extensive]
    extent_values: [focal, multifocal, diffuse, scattered, patchy]
    modifiers: {}

  # ===========================================================================
  # ASPIRATION
  # ===========================================================================

  - name: aspiration_squames
    organs: [right_lung, left_lung]
    description: >-
      Aspirated keratinized squamous cells in alveoli; typically
      maternal / amniotic origin. Co-occurs with `aspiration_meconium`:
      emit BOTH labels when both materials are stated in the same
      clause. Use `modifiers.aspiration_inflammation` to record whether
      the report states "with inflammation" or "without inflammation".
      Apply per-material severity: when a clause says "moderate squames
      and rare meconium", emit each finding with its own severity rung.
      `squamous metaplasia` is NOT aspiration_squames.
      For wrappers like "minimal nonspecific findings (rare squames)",
      use the INNER severity word.
    synonyms:
      - "aspiration of squames"
      - "aspirated squames"
      - "intraalveolar squames"
      - "squames in alveoli"
      - squames
      - "squamous cells"
    severity_values: [minimal, mild, moderate, severe, extensive]
    extent_values: [focal, multifocal, scattered, patchy, diffuse]
    modifiers:
      aspiration_inflammation: [with_inflammation, without_inflammation]

  - name: aspiration_meconium
    organs: [right_lung, left_lung]
    description: >-
      Aspirated meconium in alveoli: dense brown / green granular
      material, often forming "meconium balls". Distinct morphology
      from squames; co-occurs frequently, so emit alongside
      `aspiration_squames` when both are stated. Use
      `modifiers.aspiration_inflammation` to record "with inflammation" /
      "without inflammation". Apply per-material severity.
      Bilirubin pigment in alveoli (yellow/bile-colored) routes to
      `aspiration_gi_contents`, NOT here.
    synonyms:
      - "aspiration of meconium"
      - "intraalveolar meconium"
      - "meconium balls in alveoli"
      - "meconium aspiration"
      - "aspirated meconium"
      - "meconium balls"
    severity_values: [minimal, mild, moderate, severe, extensive]
    extent_values: [focal, multifocal, scattered, diffuse]
    modifiers:
      aspiration_inflammation: [with_inflammation, without_inflammation]

  - name: aspiration_gi_contents
    organs: [right_lung, left_lung]
    description: >-
      Aspirated gastric / GI contents (often with bile pigment, milk,
      food material). Less common than squames or meconium. Use
      `modifiers.aspiration_inflammation`. Bright yellow / bile pigment
      in alveoli routes here (aspirated bile), NOT to `hemozoin_pigment`.
    synonyms:
      - "aspiration of gastric content"
      - "aspiration of GI contents"
      - "aspirated bile pigment"
      - "aspirated gastric material"
      - "bilirubin-laden contents"
      - "food particles"
      - "food material"
      - "proteinaceous material (milk)"
      - "foreign material"
      - bronchoaspiration
      - "GI content aspiration"
      - "bile-stained material"
      - "milk material"
    severity_values: [minimal, mild, moderate, severe, extensive]
    extent_values: [focal, multifocal, scattered]
    modifiers:
      aspiration_inflammation: [with_inflammation, without_inflammation]

  # ===========================================================================
  # DEVELOPMENTAL
  # ===========================================================================

  - name: preterm_lung
    organs: [right_lung, left_lung]
    description: >-
      Preterm lung morphology: saccular / canalicular / alveolar /
      fetal stages of lung development. Indicates structural immaturity.
      Use `modifiers.ga_compatibility` to record whether the report
      reads "compatible with reported gestational age" versus
      "gestational age not reported". `developmental_stage` is binary
      `[saccular, other]`: any compound containing "saccular" (e.g.
      "late saccular/early alveolar", "terminal saccular/alveolar") →
      `saccular`; pure alveolar / canalicular / fetal-lung-stage →
      `other`.
      "fetal lung" is a PRIMARY trigger phrase. Disallow preterm_lung
      tagging when stage is pure "alveolar" without a preterm/immature
      header.
    synonyms:
      - "preterm lung"
      - "pre-term lung"
      - "premature lung"
      - "immature lung"
      - "fetal lung"
    severity_values: []
    extent_values: []
    modifiers:
      ga_compatibility: [compatible_with_reported, not_reported]
      developmental_stage: [saccular, other]

  # ===========================================================================
  # CIRCULATORY (per-organ for congestion / hemorrhage / hemosiderin)
  # ===========================================================================

  - name: liver_congestion
    organs: [liver]
    description: >-
      Vascular congestion in liver: sinusoidal / capillary / generic.
      Distinct from `sinusoidal_dilation`: "sinusoidal dilation" /
      "widened sinusoids" / "dilated sinusoids" WITHOUT `congest*` in
      the same clause → `sinusoidal_dilation`. When both appear, emit
      BOTH findings. "Hemorrhagic congestion" → emit BOTH
      `liver_congestion` AND `liver_hemorrhage`. `nutmeg liver` /
      `passive congestion` / `chronic passive congestion` are synonyms.
      Do NOT gate on `autolysis` / `inadequate`; pathologists call
      congestion through both.
    synonyms:
      - congestion
      - "capillary congestion"
      - "sinusoidal congestion"
      - "vascular congestion"
      - "nutmeg liver"
      - "passive congestion"
      - "chronic passive congestion"
    severity_values: [minimal, mild, moderate, severe, extensive]
    extent_values: [diffuse, centrilobular]
    modifiers: {}

  - name: lung_congestion
    organs: [right_lung, left_lung]
    description: >-
      Vascular congestion in lung. `pulmonary congestion` is a primary
      synonym. Compound `congestion and edema` → emit both findings
      with shared severity.
    synonyms:
      - congestion
      - "Lung congestion"
      - "Dx- Lung congestion"
      - "capillary congestion"
      - "vascular congestion"
      - "pulmonary congestion"
      - "congestive vessels"
      - "congested vessels"
      - "ectatic blood vessels"
      - "pronounced vascular congestion"
      - "subpleural congestion"
      - "interstitial congestion"
    severity_values: [minimal, mild, moderate, severe, extensive]
    extent_values: [focal, multifocal, diffuse]
    modifiers: {}

  - name: cns_congestion
    organs: [cns_post, cns_trans]
    description: >-
