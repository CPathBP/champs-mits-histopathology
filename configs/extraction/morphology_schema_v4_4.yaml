  # ===========================================================================
  # PIGMENTS (literal-extraction; per-organ for hemosiderin)
  # ===========================================================================
  #
  # PIGMENT POLICY: extraction is faithful to what the pathologist NAMED.
  # Composition is recorded only when stated, never inferred from organ
  # context.
  #
  #   - Explicit "hemozoin" / "malarial pigment" / "malaria pigment",
  #     OR stated polarizable / birefringent → `hemozoin_pigment`.
  #   - Explicit "hemosiderin" / "hemosiderosis" / "iron stain positive"
  #     / "iron-laden" / "siderophage" / "Perls" / "Prussian blue" →
  #     per-organ `*_hemosiderin`.
  #   - Bare colour/location-only pigment with no composition named
  #     and no polarizable/iron/malaria cue ("brown pigment",
  #     "golden-brown pigment", "pigmented Kupffer cells",
  #     "sinusoidal pigment", "cytoplasmic pigment") →
  #     `pigment_unspecified` (cross-organ; downstream resolves).
  #   - Artifact: "formalin pigment" / "artifact pigment" /
  #     "anthracotic pigment" / "anthracosis" / "carbon pigment" → DROP.
  #   - Bright-yellow / bile pigment in alveoli → `aspiration_gi_contents`.
  #
  # Downstream resolution (TAC Plasmodium status, IHC, iron-stain result,
  # optional organ prior) assigns the composition class for
  # `pigment_unspecified` at manifest-build time, where any organ prior
  # is applied as a downstream rule with evidence behind it rather than
  # as an extraction default.

  - name: pigment_unspecified
    organs: [liver, right_lung, left_lung, cns_post, cns_trans]
    description: >-
      Pigment described by colour and/or location only, with NO
      compositional identity named and NO polarizable / iron / malaria
      cue in the supporting text. Includes bare "brown pigment",
      "golden-brown pigment", "brown granular pigment", "pigmented
      macrophages / Kupffer cells / histiocytes", "sinusoidal pigment",
      "cytoplasmic pigment", "intravascular pigment".
      EXTRACTION-ONLY label: do not guess hemozoin vs hemosiderin from
      organ context. Downstream resolution (TAC, IHC, iron stain)
      assigns the compositional class at manifest-build time.
      Exclusions still apply:
        * "formalin" / "artifact" / "anthracotic" / "carbon" pigment → DROP.
        * Bright-yellow / bile pigment in alveoli → `aspiration_gi_contents`.
      If the report uses "hemozoin" / "malarial pigment" / polarizable
      / birefringent → emit `hemozoin_pigment` instead.
      If the report uses "hemosiderin" / "iron stain" / "siderophage" /
      Perls / Prussian blue → emit the per-organ `*_hemosiderin` instead.
    synonyms:
      - "brown pigment"
      - "golden brown pigment"
      - "golden-brown pigment"
      - "brown granular pigment"
      - "granular pigment"
      - "pigmented macrophages"
      - "pigmented Kupffer cells"
      - "Kupffer cell pigment"
      - "sinusoidal pigment"
      - "cytoplasmic pigment"
      - "intravascular pigment"
      - "pigmented histiocytes"
    severity_values: [minimal, mild, moderate, severe, extensive]
    extent_values: [focal, multifocal, scattered, diffuse, periportal, sinusoidal]
    modifiers: {}

  - name: hemozoin_pigment
    organs: [liver, right_lung, left_lung, cns_post, cns_trans]
    description: >-
      Malarial pigment. Emit ONLY when the report explicitly names it
      ("hemozoin", "hemozoin pigment", "malarial pigment", "malaria
      pigment") OR explicitly states the pigment is polarizable /
      birefringent. Route bare "brown pigment" / "golden-brown pigment"
      / "pigmented Kupffer cells" to `pigment_unspecified` regardless of
      organ context (CNS, lung, or otherwise); do not default them here.
      Downstream resolution may reclassify `pigment_unspecified` as
      hemozoin using TAC / IHC.
      Use `modifiers.pigment_location` to record sequestration biology
      when stated (intraerythrocytic = active malaria; extraerythrocytic
      = past disease, Kupffer-cell pigment). Use `modifiers.polarizable`
      for explicit polarizability statements.
      NEVER emit on "formalin pigment" / "artifact pigment" /
      "anthracotic pigment" / "anthracosis" / "carbon pigment".
      Bright-yellow / bile pigment in alveoli → `aspiration_gi_contents`,
      NOT this label.
    synonyms:
      - hemozoin
      - "hemozoin pigment"
      - "malarial pigment"
      - "malaria pigment"
      - "polarizable pigment"
      - "birefringent pigment"
    severity_values: [minimal, mild, moderate, severe, extensive]
    extent_values: [focal, multifocal, scattered, diffuse, periportal, sinusoidal]
    modifiers:
      pigment_location: [intraerythrocytic, extraerythrocytic, intravascular, perivascular, kupffer, mixed]
      polarizable: [yes, no, not_stated]

  - name: liver_hemosiderin
    organs: [liver]
    description: >-
      Hemosiderin pigment in liver. Emit ONLY when the report
      explicitly names it: "hemosiderin", "hemosiderosis", "iron stain
      positive", "iron-laden macrophages", "siderophage", "Perls
      positive", "Prussian blue positive". Bare "brown pigment" /
      "golden-brown pigment" / "brown granular pigment" with no iron
      cue in the supporting text routes to `pigment_unspecified`
      instead; any hemosiderin prior is applied downstream, with
      evidence, rather than at extraction.
      `hemosiderosis` is a primary synonym (the Latin form is
      occasionally used without an explicit "iron" word).
      Use `modifiers.hemosiderin_location` for Kupffer / hepatocyte /
      sinusoidal / periportal; multi-compartment cases emit `mixed`.
      Use `iron_stain_used: true` when the report explicitly invokes
      an iron stain ("iron stain positive", "by iron stain").
      Hemozoin + hemosiderin co-fire is correct when explicitly
      attributed to different compartments.
    synonyms:
      - hemosiderin
      - hemosiderosis
      - "hemosiderin pigment"
      - "iron stain positive"
      - "iron-laden macrophages"
      - siderophage
      - "intra-Kupffer hemosiderin"
      - "intra-hepatocyte hemosiderin"
      - "Perls positive"
      - "Prussian blue positive"
    severity_values: [minimal, mild, moderate, severe, extensive]
    extent_values: [focal, multifocal, scattered, periportal, sinusoidal, diffuse]
    modifiers:
      hemosiderin_location: [kupffer_cell, hepatocyte, periportal, sinusoidal, mixed]
      iron_stain_used: [true, false]

  - name: lung_hemosiderin
    organs: [right_lung, left_lung]
    description: >-
      Hemosiderin pigment in lung. Emit on explicit "hemosiderin",
      "hemosiderin-laden macrophages", "iron stain positive", or
      hemosiderophages. `hemosiderin-laden macrophages` is the most
      common form.
    synonyms:
      - hemosiderin
      - "hemosiderin pigment"
      - "hemosiderin-laden macrophages"
      - hemosiderophages
      - "iron stain positive"
    severity_values: [minimal, mild, moderate, severe, extensive]
    extent_values: [focal, multifocal, scattered, intraalveolar]
    modifiers: {}

  - name: cns_hemosiderin
    organs: [cns_post, cns_trans]
    description: >-
      Hemosiderin pigment in CNS; rare. Emit on explicit "hemosiderin"
      or "iron stain positive". `hemosiderophages` mark old hemorrhage.
    synonyms:
      - hemosiderin
      - "hemosiderin pigment"
      - hemosiderophages
      - "iron stain positive"
    severity_values: [minimal, mild, moderate, severe, extensive]
    extent_values: [focal, scattered]
    modifiers: {}

  # ===========================================================================
  # INFECTIONS
  # ===========================================================================

  - name: viral_inclusions
    organs: [liver, right_lung, left_lung, cns_post, cns_trans]
    description: >-
      Intranuclear / intracytoplasmic viral inclusions. Includes
      cytomegalic cells, smudge cells, syncytial cells, karyocytomegaly,
      Cowdry type A inclusions. Use `modifiers.viral_type` when the
      report names a specific virus: `cmv` for CMV / cytomegalic;
      `herpes` for HSV / herpes / Cowdry type A; `other` for adeno /
      RSV / other.
      "Hyperplastic multinucleated cells" routes here (syncytia), not
      `pneumocyte_hyperplasia`.
    synonyms:
      - "viral inclusions"
      - "viral cytopathic changes"
      - "CMV inclusion"
      - "cytomegalic cells"
      - "intranuclear inclusions"
      - "smudge cells"
      - "syncytial cells"
      - "viral syncytia"
      - karyocytomegaly
      - "owl-eye morphology"
      - "karyocytomegalic cells"
      - "viropathic inclusions"
      - "Cowdry type A inclusions"
      - "HHV5"
      - "human herpesvirus 5"
    severity_values: [minimal, mild, moderate, severe, extensive]
    extent_values: [focal, multifocal, scattered]
    modifiers:
      viral_type: [cmv, herpes, other]

  - name: pneumocystis
    organs: [right_lung, left_lung]
    description: "Pneumocystis jirovecii pneumonia (PCP / PJP)."
    synonyms: [Pneumocystis, PCP, PJP, "pneumocystis jirovecii", "pneumocystis pneumonia"]
    severity_values: []
    extent_values: []
    modifiers: {}

  - name: bacterial_colonies
    organs: [liver, right_lung, left_lung, cns_post, cns_trans]
    description: >-
      Bacterial colonies in tissue. Often intraalveolar in lung;
      postmortem overgrowth is common (drop per Principle 5). Distinct
      from `bronchopneumonia` (which requires neutrophils); both can
      co-fire when neutrophils are also present. Use
      `modifiers.bacterial_morphology` for shape: cocci, diplococci,
      rods, coccobacilli, filamentous, or mixed (when multiple shapes
      stated in one clause).
      Use `modifiers.gram_stain` for stain result: positive, negative,
      variable, not_stated.
      Use `modifiers.bacterial_location` for LIVER context anatomic
      compartment: sinusoidal, intravascular, serosal, periportal.
      For lung, location is implicit in `extent` (intraalveolar).
    synonyms:
      - "bacterial colonies"
      - "bacterial intraalveolar"
      - diplococci
      - "intravascular bacteria"
      - "sinusoidal bacteria"
      - cocci
      - "bacterial rods"
      - coccobacilli
      - "bacilliform bacteria"
      - filamentous
    severity_values: [minimal, mild, moderate, severe, extensive]
    extent_values: [focal, multifocal, intraalveolar, scattered, diffuse]
    modifiers:
      bacterial_morphology: [cocci, diplococci, rods, coccobacilli, filamentous, mixed]
      gram_stain: [positive, negative, variable, not_stated]
      bacterial_location: [sinusoidal, intravascular, serosal, periportal]

  - name: fungal
    organs: [liver, right_lung, left_lung, cns_post, cns_trans]
    description: >-
      Fungal organisms / hyphae / pseudohyphae / yeast forms. Use
      `modifiers.fungal_morphology` for `yeast`, `hyphae`,
      `pseudohyphae`, or `mixed` (when both stated in one clause).
      Add liver context for `intrasinusoidal yeast`.
    synonyms:
      - fungal
      - hyphae
      - pseudohyphae
      - "fungal organisms"
      - "yeast forms"
      - yeasts
      - "yeast-like forms"
      - "budding yeast"
      - "hyphal organisms"
      - "septate hyphae"
      - "branching hyphae"
      - fungi
      - Candida
      - "GMS-positive"
      - "intrasinusoidal yeast"
    severity_values: [minimal, mild, moderate, severe, extensive]
    extent_values: [focal, multifocal, intraalveolar, interstitial]
    modifiers:
      fungal_morphology: [yeast, hyphae, pseudohyphae, mixed]

  - name: intraerythrocytic_parasites
    organs: [liver, right_lung, left_lung, cns_post, cns_trans]
    description: >-
      Malarial parasites within red blood cells. In CNS, sequestered
      red cells in cerebral capillaries are the morphological hallmark
      of cerebral malaria (record the morphology here; do NOT emit a
      separate `cerebral_malaria` clinical-syndrome label). Use
      `modifiers.parasite_form` when the report names a stage:
      `ring_form`, `trophozoite`, `schizont`, `gametocyte`,
      `sequestered_only` (only sequestration mentioned, no stage), or
      `unspecified`.
      "Durck's granuloma" → `gliosis` with gliosis_pattern=microglial_nodule,
      NOT this label.
      Hedged language ("suspected parasites", "suggestive of malaria",
      "suspicious for parasites") → emit positive when accompanied by
      amount/extent/character; emit negated when standalone uncertain.
    synonyms:
      - "intraerythrocytic parasites"
      - "intra-red-cell parasites"
      - "parasites in erythrocytes"
      - "intraerythrocytic malarial parasites"
      - "parasitized red blood cells"
      - "parasitized erythrocytes"
      - "parasitized RBCs"
      - "sequestered erythrocytes"
      - "intraerythrocytic protozoa"
      - "intraerythrocytic organisms"
      - "intraerythrocytic microorganisms"
      - "intravascular parasites"
      - "intravascular malaria parasites"
      - "parasites within red blood cells"
      - "parasites within erythrocytes"
      - trophozoites
    severity_values: [minimal, mild, moderate, severe, extensive]
    extent_values: [scattered, multifocal, diffuse]
    modifiers:
      parasite_form: [ring_form, trophozoite, schizont, gametocyte, sequestered_only, unspecified]

  - name: granulomas
    organs: [liver, right_lung, left_lung, cns_post, cns_trans]
    description: >-
      Granulomas: epithelioid macrophage aggregates. Use
      `modifiers.granuloma_type` to mark necrotizing vs non-necrotizing.
      Necrotizing / caseating granulomas suggest TB / mycobacterial
      disease; non-necrotizing are more often parasitic or idiopathic.
      `granulomatous meningitis` routes here (organ=cns_post/cns_trans),
      NOT to `meningitis` with a new character.
      Schistosoma egg granulomas → this label.
    synonyms:
      - granuloma
      - granulomas
      - "granulomatous inflammation"
      - "necrotizing granulomas"
      - "caseating granulomas"
      - "non-necrotizing granulomas"
      - "epithelioid granulomas"
      - Schistosoma
      - "parasite egg"
      - caseating
    severity_values: [minimal, mild, moderate, severe, extensive]
    extent_values: [focal, multifocal, lobular]
    modifiers:
      granuloma_type: [necrotizing, non_necrotizing]

  # ===========================================================================
  # OTHER
  # ===========================================================================

  - name: calcification
    organs: [liver, right_lung, left_lung, cns_post, cns_trans]
    description: >-
      Tissue calcification: dystrophic / micro / macrocalcification.
      Use `modifiers.calcification_morphology` to record granularity:
      `microcalcification` (the dominant CNS form),
      `macrocalcification`, `coarse`, `punctate`, or `dystrophic`.
    synonyms:
      - calcification
      - "dystrophic calcification"
      - microcalcification
      - calcified
      - mineralization
      - "mineralized foci"
      - "mineralized neurons"
      - macrocalcification
      - "punctate calcifications"
      - "coarse calcifications"
    severity_values: [minimal, mild, moderate, severe, extensive]
    extent_values: [focal, multifocal, scattered, perivascular, intraparenchymal]
    modifiers:
      calcification_morphology: [microcalcification, macrocalcification, coarse, punctate, dystrophic]

  - name: atypical_cells_tumor
    organs: [liver, right_lung, left_lung, cns_post, cns_trans]
    description: "Atypical cells / tumor cells / neoplastic rosettes."
    synonyms:
      - "atypical cells"
      - "tumor cells"
      - rosettes
      - "sheets of atypical cells"
      - neoplastic
    severity_values: []
    extent_values: []
    modifiers: {}

