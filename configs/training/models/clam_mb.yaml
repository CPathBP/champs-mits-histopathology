# CLAM, multi-branch: one gated attention and one classifier per finding.
architecture:
  hidden_dim: 512
  attention_dim: 256
  dropout: 0.25
weight_decay: 5.0e-4
warmup_epochs: 2
instance_dropout: 0.25
# Chosen on a three-rate grid by validation macro average precision in preliminary tuning.
learning_rate: 5.0e-5
