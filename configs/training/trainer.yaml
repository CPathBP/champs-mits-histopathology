# Optimisation and checkpointing shared by every run.
max_epochs: 30
# Stop after this many validation epochs without a better checkpoint metric.
patience: 5
# Macro average precision over the selection findings on the validation split.
monitor: val_ap_core_macro
save_top_k: 3
precision: 16-mixed
gradient_clip_val: 1.0
# Slides per optimizer step; every slide is one bag.
batch_size: 4
num_workers: 4
log_every_n_steps: 10
# The positive weight of a finding is capped at this ratio.
pos_weight_max: 100.0
# A run refuses to start when its encoder lacks features for more than this share of a split.
max_dropped_share: 0.05
