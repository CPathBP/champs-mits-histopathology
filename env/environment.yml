# Analysis environment. conda provides Python and the native libraries;
# requirements.lock pins every Python package at the version used for the
# reported results and is installed without dependency resolution. See
# EXTERNALS.md for the one declared inconsistency pip check reports.
#
# Build and verify from the repository root:
#     make env          # ENV_PREFIX=<path> to choose the location
#     make env-check
#     make env-gpu      # on a machine with nvcc; MamMIL only
#
# Trident is installed unmodified from upstream at v0.2.3 without its
# declared dependencies: its metadata pins timm 0.9.16, which is not
# required; its runtime dependencies are in requirements.lock.
name: champs-repro
channels:
  - conda-forge
dependencies:
  - python=3.10.19
  - openslide=3.4.1
  - libtiff=4.5.1
  - openjpeg=2.5.0
  - pip
